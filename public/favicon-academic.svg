<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056d2"/>
      <stop offset="100%" stop-color="#003d99"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- Java Coffee Cup -->
  <g transform="translate(12, 10)">
    <!-- Steam -->
    <path d="M12 8 Q14 4 12 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M20 10 Q22 5 20 1" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M28 8 Q30 4 28 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    
    <!-- Cup -->
    <path d="M4 14 H36 V38 Q36 46 28 46 H12 Q4 46 4 38 Z" fill="#fff"/>
    
    <!-- Handle -->
    <path d="M36 20 H40 Q46 20 46 28 Q46 36 40 36 H36" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- J letter -->
    <text x="14" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0056d2">J</text>
  </g>
</svg>
